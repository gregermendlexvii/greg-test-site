# yaml-language-server: $schema=https://schema.buildwithfern.dev/docs-yml.json

instances:
  - url: gregs-test-company.docs.buildwithfern.com
title: Plant Store API | Documentation
layout:
  searchbar-placement: header
  page-width: full
  tabs-placement: header
tabs:
  home:
    display-name: Docs
    icon: home
navigation:
  - tab: home
    layout:
      - section: Get started
        contents:
          - page: Welcome
            path: docs/pages/welcome.mdx
            icon: fa-duotone fa-house
          - page: Authentication
            path: docs/pages/authentication.mdx
            icon: fa-duotone fa-key
      - section: Guides
        contents:
          - page: Plants
            path: docs/pages/plants.mdx
            icon: fa-duotone fa-seedling
          - page: Orders
            path: docs/pages/orders.mdx
            icon: fa-duotone fa-cart-shopping
          - page: Pagination
            path: docs/pages/pagination.mdx
            icon: fa-duotone fa-arrow-right-arrow-left
          - page: Real-time events
            path: docs/pages/real-time-events.mdx
            icon: fa-duotone fa-bolt
      - api: API Reference
      - section: Resources
        contents:
          - changelog: docs/changelog
          - page: Support
            path: docs/pages/support.mdx
            icon: fa-duotone fa-headset
navbar-links:
  - type: filled
    text: Edit
    url: https://dashboard.buildwithfern.com
colors:
  accent-primary:
    light: "#008700"
    dark: "#4ADE80"
  background:
    light: "#FFFFFF"
    dark: "#111113"
  border:
    light: "#E5E7EB"
    dark: "#222325"
theme:
  page-actions: toolbar
  footer-nav: minimal
logo:
  dark: docs/assets/logo-dark.svg
  light: docs/assets/logo.svg
  height: 20
  href: https://buildwithfern.com
favicon: docs/assets/favicon.svg
css:
  - styles.css
  - docs/assets/onboarding-theme.css
typography:
  headingsFont:
    name: Inter
  bodyFont:
    name: Inter
