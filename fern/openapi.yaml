openapi: 3.1.0
servers:
  - url: https://api.plantstore.dev/v3
    description: Demo server
info:
  description: |
    This is a sample Plant Store Server based on the OpenAPI 3.1 specification. It provides a comprehensive set of endpoints for managing plants, orders, and user authentication.
    
    ### Key Features
    - **Rich API Documentation**: Includes detailed examples and schema definitions.
    - **Search Functionality**: Search for plants by tags or status.
    - **User-Friendly Endpoints**: Login, logout, and retrieve user information.
    - **Error Handling**: Clear and consistent error responses.
    
    ### Developer Notes
    - Use `api_key` for store endpoints requiring authorization.
    - OAuth2 flow is available for plant-specific operations.
    
  version: 3.0.0
  title: Swagger Plant Store - OpenAPI 3.1
  termsOfService: "http://buildwithfern.com/tos/"
  contact:
    name: Plant Store API Support
    url: https://support.plantstore.dev
    email: support@buildwithfern.com
  license:
    name: Apache 2.0
    url: "http://www.apache.org/licenses/LICENSE-2.0.html"
tags:
  - name: plant
    description: Everything about your Plants
    externalDocs:
      description: Plant API Documentation
      url: https://docs.plantstore.dev/plants
  - name: store
    description: Access to Plantstore orders
    externalDocs:
      description: Order Management Guide
      url: https://docs.plantstore.dev/orders
  - name: user
    description: Operations about user
    externalDocs:
      description: User Management API
      url: https://docs.plantstore.dev/users
paths:
  /plant:
    post:
      tags:
        - plant
      summary: Add a new plant to the store
      operationId: addPlant
      requestBody:
        description: Details of the plant to add
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Plant"
            examples:
              example1:
                summary: Add a Fern Plant
                value:
                  name: "Fern"
                  category: "Indoor"
                  tags: ["green", "leafy"]
                  status: "available"
      responses:
        "200":
          description: Plant successfully added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantResponse"
              examples:
                exampleResponse:
                  summary: Successful Plant Addition
                  value:
                    id: 101
                    name: "Fern"
                    status: "available"
                    tags: ["green", "leafy"]
        "405":
          description: Invalid input
    put:
      tags:
        - plant
      summary: Update an existing plant
      operationId: updatePlant
      requestBody:
        description: Updated details of the plant
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Plant"
            examples:
              example1:
                summary: Update plant status
                value:
                  name: "Fern"
                  category: "Indoor"
                  tags: ["green", "leafy"]
                  status: "sold"
      responses:
        "200":
          description: Plant successfully updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantResponse"
              examples:
                exampleResponse:
                  summary: Successful Plant Update
                  value:
                    id: 101
                    name: "Fern"
                    status: "sold"
                    tags: ["green", "leafy"]
        "400":
          description: Invalid ID supplied
        "404":
          description: Plant not found
  /plant/search/status:
    get:
      tags:
        - plant
      summary: Search plants by status
      description: Filter plants based on their current status. Results are paginated; pass `nextCursor` back as `cursor` to fetch the next page.
      operationId: searchPlantsByStatus
      parameters:
        - name: status
          in: query
          description: The status of plants to search for.
          required: false
          schema:
            type: string
            enum: [available, pending, sold, archived]
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: List of plants matching the status filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantSearchPage"
              examples:
                exampleResponse:
                  summary: Plants with status available
                  value:
                    data:
                      - id: 101
                        name: "Fern"
                        status: "available"
                        tags: ["green", "leafy"]
                      - id: 102
                        name: "Palm"
                        status: "available"
                        tags: ["tropical"]
                    nextCursor: "eyJpZCI6MTAzfQ"
  /plant/search/tags:
    get:
      tags:
        - plant
      summary: Search plants by tags
      description: Filter plants based on associated tags. Results are paginated; pass `nextCursor` back as `cursor` to fetch the next page.
      operationId: searchPlantsByTags
      parameters:
        - name: tags
          in: query
          description: Tags to filter plants (comma-separated).
          schema:
            type: array
            items:
              type: string
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "200":
          description: List of plants matching the tags filter
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantSearchPage"
              examples:
                exampleResponse:
                  summary: Plants filtered by tags
                  value:
                    data:
                      - id: 101
                        name: "Fern"
                        status: "available"
                        tags: ["green", "leafy"]
                      - id: 103
                        name: "Cactus"
                        status: "available"
                        tags: ["spiky", "desert"]
                    nextCursor: "eyJpZCI6MTAzfQ"
  /plant/{plantId}:
    get:
      tags:
        - plant
      summary: Find plant by ID
      description: Retrieve a plant's details by its ID.
      operationId: getPlantById
      parameters:
        - name: plantId
          in: path
          description: ID of the plant to retrieve
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Details of the requested plant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantResponse"
              examples:
                exampleResponse:
                  summary: Plant details
                  value:
                    id: 101
                    name: "Fern"
                    status: "available"
                    tags: ["green", "leafy"]
    delete:
      tags:
        - plant
      summary: Delete a plant
      description: |
        Permanently remove a plant from the store by its ID. Plants with a `pending` order
        cannot be deleted; set their status to `archived` instead.
      operationId: deletePlant
      parameters:
        - name: plantId
          in: path
          description: ID of the plant to delete
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Plant deleted successfully
        "404":
          description: Plant not found
        "409":
          description: Plant has a pending order and cannot be deleted
  /store/order:
    post:
      tags:
        - store
      summary: Place an order for a plant
      description: |
        Place an order for a plant that is `available`. On success the plant's status
        changes to `pending` until the order is delivered or cancelled.
      operationId: placeOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderRequest"
            examples:
              exampleRequest:
                summary: Order one Fern
                value:
                  plantId: 101
                  quantity: 1
      responses:
        "201":
          description: Order placed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
              examples:
                exampleResponse:
                  summary: Placed order
                  value:
                    id: 5001
                    plantId: 101
                    quantity: 1
                    status: "placed"
                    shipDate: "2026-11-09T00:00:00Z"
        "409":
          description: Plant is not available to order
  /store/order/{orderId}:
    get:
      tags:
        - store
      summary: Find order by ID
      description: Retrieve an order's details and current status by its ID.
      operationId: getOrderById
      parameters:
        - name: orderId
          in: path
          description: ID of the order to retrieve
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Details of the requested order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "404":
          description: Order not found
    delete:
      tags:
        - store
      summary: Cancel an order
      description: Cancel an order that has not shipped yet. The plant's status returns to `available`.
      operationId: cancelOrder
      parameters:
        - name: orderId
          in: path
          description: ID of the order to cancel
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Order cancelled
        "404":
          description: Order not found
        "409":
          description: Order has already shipped and cannot be cancelled
  /user/auth/login:
    post:
      tags:
        - user
      summary: Logs user into the system
      description: |
        Exchange a username and password for an access token and a refresh token.
        Credentials go in the JSON request body; query-parameter credentials are no longer accepted.
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
            examples:
              exampleRequest:
                summary: Log in as john_doe
                value:
                  username: "john_doe"
                  password: "correct-horse-battery-staple"
      responses:
        "200":
          description: Successful login
          headers:
            Set-Cookie:
              description: Session token for user authentication
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAuthResponse"
              examples:
                exampleResponse:
                  summary: Successful login response
                  value:
                    token: "abc123token"
                    expiresIn: 900
                    refreshToken: "rt_9f8e7d6c5b4a"
        "401":
          description: Invalid username or password
  /user/auth/refresh:
    post:
      tags:
        - user
      summary: Refresh an access token
      description: |
        Exchange a refresh token for a new access token before the current one expires.
        Each refresh token can be used once; the response includes a new one.
      operationId: refreshToken
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshRequest"
            examples:
              exampleRequest:
                summary: Refresh a token
                value:
                  refreshToken: "rt_9f8e7d6c5b4a"
      responses:
        "200":
          description: New access and refresh tokens
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserAuthResponse"
              examples:
                exampleResponse:
                  summary: Refreshed tokens
                  value:
                    token: "def456token"
                    expiresIn: 900
                    refreshToken: "rt_1a2b3c4d5e6f"
        "401":
          description: Refresh token is invalid, expired, or already used
  /user/auth/logout:
    post:
      tags:
        - user
      summary: Logs out current logged-in user session
      description: End the current session and revoke its refresh token.
      operationId: logoutUser
      responses:
        "204":
          description: Successful logout
  /user/{username}:
    get:
      tags:
        - user
      summary: Get user by username
      description: Retrieve user details using their username.
      operationId: getUserByName
      parameters:
        - name: username
          in: path
          description: Username of the user to retrieve
          required: true
          schema:
            type: string
      responses:
        "200":
          description: User details retrieved successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
              examples:
                exampleResponse:
                  summary: User details response
                  value:
                    id: 1
                    username: "john_doe"
                    email: "john@example.com"
components:
  parameters:
    Limit:
      name: limit
      in: query
      description: Maximum number of plants to return per page (1-100).
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      description: Opaque cursor from a previous page's `nextCursor`. Omit it to fetch the first page.
      required: false
      schema:
        type: string
  schemas:
    PlantSearchPage:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: "#/components/schemas/PlantResponse"
        nextCursor:
          type: [string, "null"]
          description: Cursor for the next page, or null when there are no more results.
    Plant:
      type: object
      properties:
        name:
          type: string
        category:
          type: string
        tags:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [available, pending, sold, archived]
    PlantResponse:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        status:
          type: string
        tags:
          type: array
          items:
            type: string
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          description: The username for login
        password:
          type: string
          format: password
          description: The password for login
    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken:
          type: string
          description: Refresh token from a previous login or refresh
    UserAuthResponse:
      type: object
      properties:
        token:
          type: string
          description: Access token
        expiresIn:
          type: integer
          description: Access token lifetime in seconds (15 minutes)
        refreshToken:
          type: string
          description: Single-use token for getting a new access token from `/user/auth/refresh`
    User:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        email:
          type: string
    OrderRequest:
      type: object
      required: [plantId, quantity]
      properties:
        plantId:
          type: integer
          description: ID of the plant to order
        quantity:
          type: integer
          minimum: 1
          description: Number of plants to order
    Order:
      type: object
      properties:
        id:
          type: integer
        plantId:
          type: integer
        quantity:
          type: integer
        status:
          type: string
          enum: [placed, shipped, delivered, cancelled]
        shipDate:
          type: string
          format: date-time
